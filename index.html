<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<style>
:root{--bg:#f4f1ea;--fg:#1f2a24;--card:#fff;--snake:#2f7d4f;--head:#1d5c37;--food:#d9442b;--line:#e6e1d3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121b16;--fg:#e8efe9;--card:#1b2822;--snake:#4fbf7f;--head:#8be3ae;--food:#ff6a4d;--line:#25352d}}
:root[data-theme="dark"]{--bg:#121b16;--fg:#e8efe9;--card:#1b2822;--snake:#4fbf7f;--head:#8be3ae;--food:#ff6a4d;--line:#25352d}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;touch-action:none;user-select:none}
h1{margin:0;font-size:22px}
.bar{display:flex;gap:20px;font-size:16px}
.wrap{position:relative}
canvas{background:var(--card);border:2px solid var(--line);border-radius:12px;display:block;box-shadow:0 0 28px color-mix(in srgb,var(--snake) 35%,transparent)}
#s{display:inline-block}.pop{animation:pop .3s}@keyframes pop{50%{transform:scale(1.6);color:var(--food)}}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 80%,transparent);border-radius:12px;text-align:center;font-size:18px;gap:8px}
button{font:inherit;background:var(--snake);color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px}
.pad button{padding:0;font-size:22px;background:var(--card);color:var(--fg);border:2px solid var(--line)}
.pad .u{grid-column:2}.pad .l{grid-row:2;grid-column:1}.pad .d{grid-row:2;grid-column:2}.pad .r{grid-row:2;grid-column:3}
</style></head><body>
<h1>🐍 Snake</h1>
<div class="bar"><span>Score: <b id="s">0</b></span><span>Best: <b id="b">0</b></span></div>
<div class="wrap"><canvas id="c"></canvas>
<div id="msg"><div>Swipe, arrow keys, ya buttons use karein</div><button id="go">Start</button></div></div>
<div class="pad"><button class="u" data-d="0,-1">▲</button><button class="l" data-d="-1,0">◀</button><button class="d" data-d="0,1">▼</button><button class="r" data-d="1,0">▶</button></div>
<script>
const N=18,c=document.getElementById('c'),x=c.getContext('2d');
const S=Math.min(360,Math.floor((Math.min(innerWidth,innerHeight*0.6)-32)/N)*N),cell=S/N;
c.width=c.height=S;
let snake,dir,next,food,score,timer,best=0;
try{best=+localStorage.getItem('snakeBest')||0}catch(e){}
const $=id=>document.getElementById(id);$('b').textContent=best;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v);
function place(){do{food={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(p=>p.x==food.x&&p.y==food.y))}
function start(){snake=[{x:9,y:9},{x:8,y:9},{x:7,y:9}];dir=next={x:1,y:0};score=0;$('s').textContent=0;place();$('msg').style.display='none';clearInterval(timer);timer=setInterval(tick,120);draw()}
function over(){clearInterval(timer);shake=14;burst((snake[0].x+.5)*cell,(snake[0].y+.5)*cell,css('--snake'),40,5);if(score>best){best=score;$('b').textContent=best;try{localStorage.setItem('snakeBest',best)}catch(e){}}
$('msg').innerHTML='<div>Game over! Score: '+score+'</div><button id="go">Dobara khelein</button>';$('msg').style.display='flex';$('go').onclick=start}
function tick(){dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x==h.x&&p.y==h.y))return over();
snake.unshift(h);if(h.x==food.x&&h.y==food.y){score++;$('s').textContent=score;burst((food.x+.5)*cell,(food.y+.5)*cell,css('--food'),26,4);pop();place()}else snake.pop();draw()}
let parts=[],shake=0;
function burst(px,py,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(Math.random()*.7+.3)*sp;parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:col})}}
function pop(){const e=$('s');e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
function draw(t=0){const f=css('--food'),sn=css('--snake'),hd=css('--head');
x.save();x.clearRect(0,0,S,S);
if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88;if(shake<.3)shake=0}
x.strokeStyle=css('--line');x.globalAlpha=.5;x.lineWidth=1;x.beginPath();for(let i=1;i<N;i++){x.moveTo(i*cell,0);x.lineTo(i*cell,S);x.moveTo(0,i*cell);x.lineTo(S,i*cell)}x.stroke();x.globalAlpha=1;
const pu=1+Math.sin(t/180)*.12;x.shadowColor=f;x.shadowBlur=18*pu;x.fillStyle=f;x.beginPath();x.arc((food.x+.5)*cell,(food.y+.5)*cell,cell*.34*pu,0,7);x.fill();
snake.forEach((p,i)=>{x.globalAlpha=1-i/(snake.length+6)*.5;x.shadowColor=i?sn:hd;x.shadowBlur=i?6:14;x.fillStyle=i?sn:hd;x.beginPath();x.roundRect(p.x*cell+1,p.y*cell+1,cell-2,cell-2,6);x.fill()});
x.globalAlpha=1;x.shadowBlur=0;
const h=snake[0];x.fillStyle='#fff';for(const e of[-1,1]){x.beginPath();x.arc((h.x+.5+dir.x*.15-dir.y*.22*e)*cell,(h.y+.5+dir.y*.15+dir.x*.22*e)*cell,cell*.1,0,7);x.fill()}
parts=parts.filter(p=>p.l>0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.l-=.03;x.globalAlpha=Math.max(p.l,0);x.fillStyle=p.c;x.fillRect(p.x-2,p.y-2,4,4)});
x.restore()}
function loop(t){draw(t);requestAnimationFrame(loop)}
function turn(dx,dy){if(dx==-dir.x&&dy==-dir.y)return;next={x:dx,y:dy}}
addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();turn(...m)}});
document.querySelectorAll('.pad button').forEach(b=>b.onpointerdown=()=>turn(...b.dataset.d.split(',').map(Number)));
let t0;addEventListener('touchstart',e=>{t0=e.touches[0]},{passive:true});
addEventListener('touchend',e=>{if(!t0)return;const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;
if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy))});
$('go').onclick=start;
snake=[{x:9,y:9}];food={x:3,y:3};dir=next={x:1,y:0};requestAnimationFrame(loop);
</script></body></html>
